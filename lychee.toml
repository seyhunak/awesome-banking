# lychee configuration — https://github.com/lycheeverse/lychee
#
# Tuned for a link-dense curated guide: most entries point at github.com or
# vendor documentation, so the settings below trade raw speed for not being
# rate-limited or mistaken for a scraper.

# Cache results between runs so unchanged links are not re-fetched.
cache = true
max_cache_age = "2d"

# Politeness and reliability.
max_concurrency = 16
max_retries = 3
retry_wait_time = 3
timeout = 20
max_redirects = 5

# Many documentation hosts return 403 to non-browser agents, and 429 simply
# means "slow down" rather than "this link is dead". Treating either as a
# failure produces noise that trains maintainers to ignore the check.
accept = ["200..=299", "403", "429"]

# Identify the checker honestly rather than impersonating a browser.
user_agent = "Mozilla/5.0 (compatible; lychee/0.15; +https://github.com/seyhunak/awesome-banking)"

# Only check real entries. Code fences in CONTRIBUTING.md contain example
# git commands and placeholder URLs that are not meant to resolve.
include_verbatim = false

# Network reachability only — do NOT enable anchor checking here.
include_fragments = "none"

exclude_path = [
  ".git",
  ".github",
  ".lycheecache",
]